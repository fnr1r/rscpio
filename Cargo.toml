[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/cpiolib",
    "crates/minibinrw",
]

[workspace.dependencies]
binrw = "0.15"
cpiolib = { path = "crates/cpiolib" }
derive_more = "2"
easy-ext = "1"
minibinrw = { path = "crates/minibinrw" }
rustix = "1"
static_assertions = "1"
thiserror = "2"
trait-set = "0.3"
